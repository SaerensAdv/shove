name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Icons and splash (SVG to PNG)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p icons
          for n in 180 192 512; do rsvg-convert -w $n -h $n assets/icon.svg -o icons/icon-$n.png; done
          rsvg-convert -w 512 -h 512 assets/icon-maskable.svg -o icons/maskable-512.png
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-only.png
          rsvg-convert -w 2732 -h 2732 assets/splash.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Commit PNG icons for the web version (main and play)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/icons && cp icons/*.png /tmp/icons/
          git config user.name "shove-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for b in main play; do
            git checkout -q -f -B "$b" "origin/$b"
            mkdir -p icons && cp /tmp/icons/*.png icons/
            git add icons/*.png
            if git diff --cached --quiet; then echo "$b: icons up to date"; else git commit -q -m "Add PNG app icons [skip ci]" && git push -q origin "$b"; fi
          done
          git checkout -q -f "$GITHUB_SHA"

      - name: Build app bundle
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android
          sed -i '0,/<activity /s//<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: App icon and splash in the Android project
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#1A0F14' --splashBackgroundColor '#1A0F14'

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shove-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
